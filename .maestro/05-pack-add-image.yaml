# An image was shared: add it to the pack.
appId: com.kish.wastickers
---
# An Android "isn't responding" dialog must not block the demo.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Use this image for.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Add to \"Beach vibes\""
- extendedWaitUntil:
    visible: "Added 1 sticker.*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3500
- takeScreenshot: demo-out/07-pack-full
