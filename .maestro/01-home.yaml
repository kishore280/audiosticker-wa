# Fresh start: home screen.
appId: com.kish.wastickers
---
# An Android "isn't responding" dialog must not block the demo.
- tapOn:
    text: "Wait"
    optional: true
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Make an audio sticker"
    timeout: 40000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: demo-out/01-home
