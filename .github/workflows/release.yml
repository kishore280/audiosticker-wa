# Builds a signed APK and publishes a GitHub Release.
#
# Start it with:  a tag push  (git tag v1.0.1 && git push origin v1.0.1)
#            or:  Actions -> Release -> Run workflow   (tag = "v" + appVersion in app/build.gradle.kts)
#
# Needs 4 repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Always sign with the same key: Android installs an update only when the key is the same.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match appVersion $v in app/build.gradle.kts"; exit 1
          fi

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets first."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare files
        id: files
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StickerStudio-$v.apk"
          (cd dist && sha256sum "StickerStudio-$v.apk" > "StickerStudio-$v.apk.sha256")
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Sticker Studio $v" > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sticker Studio ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/StickerStudio-${{ steps.version.outputs.version }}.apk
            dist/StickerStudio-${{ steps.version.outputs.version }}.apk.sha256
