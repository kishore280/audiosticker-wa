# Records a real demo of the app on an Android emulator (Maestro drives the taps, adb records the screen).
# Run: Actions -> Demo video -> Run workflow. Download the "demo-video" artifact.
name: Demo video

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: engine/go.sum
      # Engine for arm64 + x86_64: the x86_64 emulator then runs it natively (the Go runtime crashes under ARM translation).
      - name: Build engine (arm64 + x86_64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          TARGETS=android/arm64,android/amd64 bash engine/build.sh
      - run: ./gradlew --no-daemon assembleDebug -PextraAbis=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # x86_64 Android 14 image: it runs the arm64 app with Google's ARM translation.
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/demo.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: demo-out/
          retention-days: 14
